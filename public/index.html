<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaTeX Editor</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    
    <!-- CodeMirror (Offline Local Vendor) -->
    <link rel="stylesheet" href="/vendor/codemirror/codemirror.min.css">
    <link rel="stylesheet" href="/vendor/codemirror/monokai.min.css">
    <script src="/vendor/codemirror/codemirror.min.js"></script>
    <script src="/vendor/codemirror/stex.min.js"></script>
    <script src="/vendor/codemirror/active-line.min.js"></script>

    <!-- PDF.js (Offline Local Vendor) -->
    <script src="/vendor/pdfjs/pdf.min.js"></script>
    <link rel="stylesheet" href="/vendor/pdfjs/pdf_viewer.min.css">

    <!-- Split.js (Offline Local Vendor) -->
    <script src="/vendor/split/split.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <span>LaTeX Editor</span>
            </div>
            <div id="status-pill" class="status-pill status-ready">Ready</div>
        </div>

        <div class="header-center">
            <div class="zoom-stepper">
                <button id="zoom-out-btn" class="stepper-btn" title="Zoom Out (Ctrl -)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
                <span id="zoom-level">150%</span>
                <button id="zoom-in-btn" class="stepper-btn" title="Zoom In (Ctrl +)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </div>
        </div>

        <div class="header-right">
            <button id="compile-btn" class="btn btn-primary" title="Compile LaTeX (Ctrl+S / Ctrl+Enter)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                <span>Compile</span>
            </button>
            <div class="dropdown" id="export-dropdown">
                <button id="export-menu-btn" class="btn btn-secondary" title="Export document">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    <span>Export</span>
                    <svg class="dropdown-chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div class="dropdown-menu" id="export-menu">
                    <button id="export-pdf-item" class="dropdown-item">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                        <span>Export PDF (.pdf)</span>
                    </button>
                    <button id="export-docx-item" class="dropdown-item">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                        </svg>
                        <span>Export Word (.docx)</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container">
        <!-- Left Pane: Code Editor -->
        <section id="editor-pane" class="split-pane">
            <textarea id="latex-code"></textarea>
        </section>

        <!-- Right Pane: PDF Preview -->
        <section id="preview-pane" class="split-pane">
            <div id="pdf-scroll-container">
                <div id="pdf-viewer"></div>
            </div>

            <!-- Error Overlay -->
            <div id="error-overlay" class="hidden">
                <div class="error-header">
                    <div class="error-title">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <span>LaTeX Compilation Error</span>
                    </div>
                    <button id="error-dismiss-btn" class="error-close-btn">&times;</button>
                </div>
                <pre id="error-log"></pre>
            </div>
        </section>
    </main>

    <!-- Application Script -->
    <script src="/backend-adapter.js"></script>
    <script src="/main.js"></script>
</body>
</html>
